# Logging (immediate mode for USB CDC console)
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# LED Strip driver
CONFIG_LED_STRIP=y
CONFIG_LED_STRIP_LOG_LEVEL_DBG=y

# USB CDC ACM for console
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# USB device identification
CONFIG_USB_DEVICE_PRODUCT="Feather M4 CAN"
CONFIG_USB_DEVICE_VID=0x239A
CONFIG_USB_DEVICE_PID=0x0022

# CAN bus
CONFIG_CAN=y

# PWM
CONFIG_PWM=y

# Increase log buffer for debugging
CONFIG_LOG_BUFFER_SIZE=2048

